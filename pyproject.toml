[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "storm-chasers-apple-backend"
version = "0.1.0"
description = "A small authenticated proxy for Apple WeatherKit data."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Flask>=3.1,<4",
    "flask-cors>=6,<7",
    "gunicorn>=23,<24",
    "PyJWT[crypto]>=2.10,<3",
    "requests>=2.32,<3",
    "timezonefinder>=6.5,<9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.14,<1",
]

[tool.setuptools]
py-modules = ["app", "moon_illumination", "weather_format", "weatherkit_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

